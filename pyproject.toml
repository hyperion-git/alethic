[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alethic"
version = "3.7.0"
description = "A reasoning agent for mathematics and physics inspired by Google DeepMind's Aletheia, built on Claude (Opus 4.6)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "hyperion-git" },
]
keywords = [
    "ai",
    "math",
    "physics",
    "reasoning",
    "agent",
    "claude",
    "anthropic",
    "theorem-proving",
    "derivation",
    "verification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]
scientific = [
    "numpy>=1.26",
    "sympy>=1.13",
    "scipy>=1.12",
    "mpmath>=1.3",
    "matplotlib>=3.8",
]
openrouter = [
    "openai>=1.0,<3.0",
]

[project.scripts]
alethic = "alethic.cli:main"

[project.urls]
Homepage = "https://github.com/hyperion-git/alethic"
Repository = "https://github.com/hyperion-git/alethic"
Issues = "https://github.com/hyperion-git/alethic/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/alethic"]

# ── Ruff ──────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["alethic"]

# ── Mypy ──────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "live: tests requiring a real Anthropic API key (deselect with -m 'not live')",
    "integration: tests requiring external API keys (deselect with -m 'not integration')",
]
